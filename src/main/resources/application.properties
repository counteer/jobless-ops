spring.application.name=joblessops

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/joblessops
spring.datasource.username=joblessops
spring.datasource.password=joblessops

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true